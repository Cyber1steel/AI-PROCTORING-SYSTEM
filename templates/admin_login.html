<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@0,500;0,600&family=Archivo:wght@400;500;600&family=Fragment+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student_login.css') }}">
<body>
    <div class="login-container">
        <p class="eyebrow">Admin access</p>
        <h2>Sign in</h2>
        <form id="adminLoginForm">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="name@university.edu" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Sign in</button>
        </form>
        <p id="errormsg" class="error-text"></p>
    </div>

    <script>
        document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("errormsg");

            const formData = new FormData();
            formData.append("email", email);
            formData.append("password", password);

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();

                if (!res.ok) {
                    errorMsg.innerText = data.error || "Login failed";
                    return;
                }

                if (data.role !== "admin") {
                    errorMsg.innerText = "This account is not an admin.";
                    return;
                }

                localStorage.setItem("token", data.token);
                localStorage.setItem("role", data.role);
                localStorage.setItem("user_id", data.user_id);
                localStorage.setItem("name", data.name || "");

                window.location.href = "/admin";
            } catch (err) {
                errorMsg.innerText = "Something went wrong. Try again.";
            }
        });
    </script>
</body>
</html>
